name: Test Install script locally

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to install from'
        required: false
        default: 'main'
      vulcanexus_distro:
        description: 'Vulcanexus distro to install to. It refers to the vulcanexus branch name'
        required: false
        default: 'kilted'

  pull_request:
    branches:
      - 'main'
      - 'kilted'

  push:
    branches:
      - 'main'
      - 'kilted'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install_script_locally:
    runs-on: ubuntu-latest

    env:
      BRANCH: ${{ inputs.branch || github.head_ref || github.ref_name }}
      VULCANEXUS_DISTRO: ${{ inputs.vulcanexus_distro || 'kilted' }}

    steps:
    - name: Free disk space
      uses: eProsima/eProsima-CI/ubuntu/free_disk_space@v0

    - name: Checkout repository
      uses: eProsima/eProsima-CI/external/checkout@v0
      with:
        path: src/agile-hri
        ref: ${{ env.BRANCH }}

    - name: Install apt dependencies
      uses: eProsima/eProsima-CI/ubuntu/install_apt_packages@v0
      with:
        packages: wget
        update: false
        upgrade: false

    - name: Get Vulcanexus Script
      shell: bash
      run: |
        wget -qO linux_binary_installation.bash https://raw.githubusercontent.com/eProsima/vulcanexus/refs/heads/${{ env.VULCANEXUS_DISTRO }}/docs/resources/scripts/linux_binary_installation.bash
        chmod +x ./linux_binary_installation.bash

    - name: Run Vulcanexus Script
      shell: bash
      run: |
        ./linux_binary_installation.bash

    - name: Run install script
      shell: bash
      run: |
        source /opt/vulcanexus/${{ env.VULCANEXUS_DISTRO }}/setup.bash && bash src/agile-hri/install_hri.sh -y

    - name: Verify HRI installation
      shell: bash
      env:
        VULCANEXUS_DISTRO: ${{ env.VULCANEXUS_DISTRO }}
      run: |
        source "/opt/vulcanexus/${VULCANEXUS_DISTRO}/setup.bash"

        set -euo pipefail

        echo "Checking HRI ROS 2 packages are discoverable..."
        for pkg in hri_msgs hri_id_manager hri_face_detect hri_pose_detect hri_emotion_detect hri_detection_display hri_stt hri_tts; do
          if ! ros2 pkg list | grep -x "$pkg" > /dev/null; then
            echo "ERROR: Package '$pkg' not found in 'ros2 pkg list'"
            exit 1
          fi
          echo "  - Found package: $pkg"
        done

        echo "Checking that HRI message types are available..."
        ros2 interface show hri_msgs/msg/Audio > /dev/null
        ros2 interface show hri_msgs/msg/NormalizedPointOfInterest2D > /dev/null || true  # adjust to your actual types

        echo "HRI installation sanity check passed"
